<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crochet Web Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
    }

    header {
      background: #e91e63;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
      color: #e91e63;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 5px;
    }

    .login-btn,
    .add-btn {
      background: #e91e63;
      color: white;
      width: 100%;
    }

    .logout-btn {
      background: #333;
      color: white;
      float: right;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
    }

    .product {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .product img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product-info {
      flex: 1;
    }

    .product-info h3 {
      margin: 0 0 5px;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }

    .preview {
      max-width: 150px;
      max-height: 150px;
      border-radius: 10px;
      margin-top: 5px;
      display: none;
    }

    @media (max-width: 600px) {
      .product {
        flex-direction: column;
        align-items: flex-start;
      }

      .product img {
        width: 100%;
        height: 180px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🧶 Crochet Web Admin</h1>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginSection" class="box">
    <h2>Admin Login</h2>

    <form onsubmit="login(event)">
      <label>Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Admin email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button class="login-btn" type="submit">
        Login
      </button>
    </form>

    <button
      onclick="forgotPassword()"
      style="background:none;color:#e91e63;width:100%;margin-top:10px;"
    >
      Forgot Password?
    </button>

    <div id="loginMessage" class="message"></div>
  </div>


  <!-- ADMIN PANEL -->
  <div id="adminSection" class="hidden">

    <div class="box">
      <button class="logout-btn" onclick="logout()">Logout</button>

      <h2>Admin Panel</h2>
      <p>Welcome, <strong id="adminEmail"></strong></p>
    </div>


    <!-- ADD PRODUCT -->
    <div class="box">
      <h2>➕ Add Product</h2>

      <form onsubmit="addProduct(event)">

        <label>Product Name</label>
        <input
          type="text"
          id="productName"
          placeholder="Product name"
          required
        >

        <label>Price</label>
        <input
          type="number"
          id="productPrice"
          placeholder="Price"
          min="0"
          required
        >

        <label>Category</label>
        <select id="productCategory" required>
          <option value="">Select Category</option>
          <option value="Bags">Bags</option>
          <option value="Flowers">Flowers</option>
          <option value="Keychains">Keychains</option>
          <option value="Toys">Toys</option>
          <option value="Clothes">Clothes</option>
          <option value="Accessories">Accessories</option>
          <option value="Other">Other</option>
        </select>

        <label>Product Image</label>
        <input
          type="file"
          id="productImage"
          accept="image/*"
          required
          onchange="previewImage(event)"
        >

        <img id="imagePreview" class="preview">

        <button class="add-btn" type="submit">
          Add Product
        </button>
      </form>

      <div id="productMessage" class="message"></div>
    </div>


    <!-- PRODUCTS -->
    <div class="box">
      <h2>📦 My Products</h2>
      <div id="productsList">
        Loading products...
      </div>
    </div>

  </div>

</div>


<script>

  // ==============================
  // SUPABASE
  // ==============================

  const SUPABASE_URL =
    "https://ocwtzuwjnceushnytira.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_zMT-DSHVHl0vRiAxeAQvmA_YnbWjaOT";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==============================
  // LOGIN
  // ==============================

  async function login(event) {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    showMessage(
      "loginMessage",
      "Logging in...",
      "success"
    );

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      showMessage(
        "loginMessage",
        error.message,
        "error"
      );

      return;
    }

    if (!data.user) {

      showMessage(
        "loginMessage",
        "Login failed.",
        "error"
      );

      return;
    }

    showAdminPanel(data.user);

  }


  // ==============================
  // FORGOT PASSWORD
  // ==============================

  async function forgotPassword() {

    const email =
      document.getElementById("email").value.trim();

    if (!email) {

      showMessage(
        "loginMessage",
        "Pehle apni email enter karo.",
        "error"
      );

      return;
    }

    const redirectUrl =
      window.location.origin +
      window.location.pathname;

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: redirectUrl
        }
      );

    if (error) {

      showMessage(
        "loginMessage",
        error.message,
        "error"
      );

      return;
    }

    showMessage(
      "loginMessage",
      "Password reset link email par bhej diya gaya hai.",
      "success"
    );

  }


  // ==============================
  // SHOW ADMIN
  // ==============================

  function showAdminPanel(user) {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("adminSection")
      .classList.remove("hidden");

    document
      .getElementById("adminEmail")
      .textContent = user.email;

    loadProducts();

  }


  // ==============================
  // CHECK SESSION
  // ==============================

  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (data.session && data.session.user) {

      showAdminPanel(data.session.user);

    }

  }


  // ==============================
  // AUTH STATE
  // ==============================

  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      if (session && session.user) {

        showAdminPanel(session.user);

      }

    }
  );


  // ==============================
  // LOGOUT
  // ==============================

  async function logout() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("adminSection")
      .classList.add("hidden");

    document
      .getElementById("loginSection")
      .classList.remove("hidden");

    document.getElementById("password").value = "";

  }


  // ==============================
  // IMAGE PREVIEW
  // ==============================

  function previewImage(event) {

    const file = event.target.files[0];

    const preview =
      document.getElementById("imagePreview");

    if (!file) {

      preview.style.display = "none";
      return;

    }

    if (file.size > 2 * 1024 * 1024) {

      showMessage(
        "productMessage",
        "Image 2MB se choti honi chahiye.",
        "error"
      );

      event.target.value = "";
      preview.style.display = "none";

      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

      preview.src = e.target.result;
      preview.style.display = "block";

    };

    reader.readAsDataURL(file);

  }


  // ==============================
  // ADD PRODUCT
  // ==============================

  async function addProduct(event) {

    event.preventDefault();

    const {
      data: sessionData
    } = await supabaseClient.auth.getSession();

    const user =
      sessionData.session?.user;

    if (!user) {

      showMessage(
        "productMessage",
        "Please login first.",
        "error"
      );

      return;
    }

    const name =
      document
        .getElementById("productName")
        .value.trim();

    const price =
      Number(
        document
          .getElementById("productPrice")
          .value
      );

    const category =
      document
        .getElementById("productCategory")
        .value;

    const imageFile =
      document
        .getElementById("productImage")
        .files[0];

    if (!imageFile) {

      showMessage(
        "productMessage",
        "Product image select karo.",
        "error"
      );

      return;
    }

    if (imageFile.size > 2 * 1024 * 1024) {

      showMessage(
        "productMessage",
        "Image 2MB se choti honi chahiye.",
        "error"
      );

      return;
    }

    showMessage(
      "productMessage",
      "Product add ho raha hai...",
      "success"
    );


    // Convert image to Base64
    const imageUrl =
      await fileToBase64(imageFile);


    const { error } =
      await supabaseClient
        .from("products")
        .insert({

          user_id: user.id,

          name: name,

          price: price,

          category: category,

          image_url: imageUrl,

          rating: 0,

          review_count: 0

        });


    if (error) {

      showMessage(
        "productMessage",
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "productMessage",
      "✅ Product successfully add ho gaya!",
      "success"
    );


    document
      .getElementById("productName")
      .value = "";

    document
      .getElementById("productPrice")
      .value = "";

    document
      .getElementById("productCategory")
      .value = "";

    document
      .getElementById("productImage")
      .value = "";

    document
      .getElementById("imagePreview")
      .style.display = "none";


    loadProducts();

  }


  // ==============================
  // FILE TO BASE64
  // ==============================

  function fileToBase64(file) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();

        reader.onload =
          () => resolve(reader.result);

        reader.onerror =
          error => reject(error);

        reader.readAsDataURL(file);

      }
    );

  }


  // ==============================
  // LOAD PRODUCTS
  // ==============================

  async function loadProducts() {

    const {
      data: sessionData
    } = await supabaseClient.auth.getSession();

    const user =
      sessionData.session?.user;

    if (!user) return;


    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq("user_id", user.id)
        .order(
          "created_at",
          { ascending: false }
        );


    const container =
      document.getElementById("productsList");


    if (error) {

      container.innerHTML =
        `<p style="color:red;">${escapeHtml(error.message)}</p>`;

      return;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        "<p>No products added yet.</p>";

      return;
    }


    container.innerHTML =
      data.map(product => `

        <div class="product">

          <img
            src="${escapeAttribute(product.image_url || "")}"
            alt="${escapeAttribute(product.name || "Product")}"
          >

          <div class="product-info">

            <h3>
              ${escapeHtml(product.name || "")}
            </h3>

            <p>
              💰 Price: ${escapeHtml(String(product.price ?? ""))}
            </p>

            <p>
              🏷️ Category:
              ${escapeHtml(product.category || "")}
            </p>

            <p>
              ⭐ Rating:
              ${Number(product.rating || 0).toFixed(1)}
            </p>

            <button
              class="delete-btn"
              onclick="deleteProduct('${escapeAttribute(product.id)}')"
            >
              Delete
            </button>

          </div>

        </div>

      `).join("");

  }


  // ==============================
  // DELETE PRODUCT
  // ==============================

  async function deleteProduct(id) {

    const confirmed =
      confirm(
        "Kya aap ye product delete karna chahte ho?"
      );

    if (!confirmed) return;


    const {
      data: sessionData
    } = await supabaseClient.auth.getSession();

    const user =
      sessionData.session?.user;

    if (!user) return;


    const { error } =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id", id)
        .eq("user_id", user.id);


    if (error) {

      alert(
        "Delete error: " +
        error.message
      );

      return;
    }


    loadProducts();

  }


  // ==============================
  // MESSAGE
  // ==============================

  function showMessage(
    id,
    text,
    type
  ) {

    const box =
      document.getElementById(id);

    box.textContent = text;

    box.className =
      "message " + type;

    box.style.display = "block";

  }


  // ==============================
  // SECURITY HELPERS
  // ==============================

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHtml(value);

  }


  // START
  checkSession();

</script>

</body>
</html>
